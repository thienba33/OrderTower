# Hạ tầng của dự án: PostgreSQL, Keycloak, APISIX, SeaweedFS.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ordertower
      POSTGRES_PASSWORD: ordertower
      POSTGRES_DB: ordertower
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  apisix:
    image: apache/apisix:3.19.0-debian
    ports:
      - "9080:9080"
      - "9180:9180"
    # Chế độ standalone: cấu hình bằng tệp, không dùng etcd.
    volumes:
      - ./infra/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./infra/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    depends_on:
      - postgres

  seaweedfs:
    # Chế độ mini: master, volume, filer và cổng S3 trong một tiến trình.
    image: chrislusf/seaweedfs:4.51
    command: mini -dir=/data
    ports:
      - "8333:8333"
      - "8888:8888"
      - "9333:9333"
    volumes:
      - swdata:/data

  api:
    build: ./services/api
    ports:
      - "3001:3001"
    env_file:
      - .env
    depends_on:
      - postgres
      - seaweedfs

  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - api

volumes:
  pgdata:
  swdata:
