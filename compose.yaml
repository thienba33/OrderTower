# Hạ tầng của dự án: PostgreSQL, Keycloak, APISIX, SeaweedFS.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ordertower
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_DB: ordertower
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
      ORDERTOWER_DB_PASSWORD: ${ORDERTOWER_DB_PASSWORD:?ORDERTOWER_DB_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Khởi tạo database Keycloak và user ứng dụng khi volume còn trống.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordertower -d ordertower"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    # Chế độ phát triển: khởi động Keycloak với cơ sở dữ liệu PostgreSQL và nhập realm từ tệp.
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      ORDERTOWER_DEMO_PASSWORD: ${ORDERTOWER_DEMO_PASSWORD:?ORDERTOWER_DEMO_PASSWORD is required for local demo users}
      KC_HOSTNAME: http://localhost:9080
      KC_HOSTNAME_ADMIN: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
    ports:
      # Chỉ quản trị từ máy local; người dùng đăng nhập qua APISIX :9080.
      - "127.0.0.1:8081:8080"
    volumes:
      - ./infra/keycloak/realm:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

  apisix:
    image: apache/apisix:3.19.0-debian
    ports:
      - "9080:9080"
    # Chế độ standalone: cấu hình bằng tệp, không dùng etcd.
    volumes:
      - ./infra/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./infra/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro

  seaweedfs:
    # Chế độ mini: master, volume, filer và cổng S3 trong một tiến trình.
    image: chrislusf/seaweedfs:4.51
    command: mini -dir=/data

    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:9333:9333"
    volumes:
      - swdata:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://127.0.0.1:8333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build: ./services/api
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://localhost:9080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-ordertower}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-ordertower-web}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://localhost:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  swdata:
