# Hạ tầng của dự án: PostgreSQL, Keycloak, APISIX, SeaweedFS.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ordertower
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_DB: ordertower
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
      ORDERTOWER_DB_PASSWORD: ${ORDERTOWER_DB_PASSWORD:?ORDERTOWER_DB_PASSWORD is required}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Khởi tạo database Keycloak và user ứng dụng khi volume còn trống.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordertower -d ordertower"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    # Chế độ phát triển: khởi động Keycloak với cơ sở dữ liệu PostgreSQL và nhập realm từ tệp.
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      ORDERTOWER_DEMO_PASSWORD: ${ORDERTOWER_DEMO_PASSWORD:?ORDERTOWER_DEMO_PASSWORD is required for local demo users}
      KC_HOSTNAME: http://localhost:9080
      KC_HOSTNAME_ADMIN: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
    ports:
      # Chỉ quản trị từ máy local; người dùng đăng nhập qua APISIX :9080.
      - "127.0.0.1:8081:8080"
    volumes:
      - ./infra/keycloak/realm:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

  apisix:
    image: apache/apisix:3.19.0-debian
    ports:
      - "9080:9080"
    # Chế độ standalone: cấu hình bằng tệp, không dùng etcd.
    volumes:
      - ./infra/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./infra/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro

  seaweedfs:
    # Chế độ mini: master, volume, filer và cổng S3 trong một tiến trình.
    image: chrislusf/seaweedfs:4.51
    command: mini -dir=/data

    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:9333:9333"
    volumes:
      - swdata:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://127.0.0.1:8333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  clamav:
    # Kiểm dịch file upload. Lần đầu tải signature có thể mất vài phút.
    image: clamav/clamav:stable
    environment:
      CLAMAV_NO_MILTERD: "true"
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamdb:/var/lib/clamav

  openbao:
    image: openbao/openbao:2.7.3
    command: server -dev -dev-root-token-id=${OPENBAO_ROOT_TOKEN:-dev-root-token}
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${OPENBAO_ROOT_TOKEN:-dev-root-token}
      BAO_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 12

  openbao-init:
    image: openbao/openbao:2.7.3
    depends_on:
      openbao:
        condition: service_healthy
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN: ${OPENBAO_ROOT_TOKEN:-dev-root-token}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      ORDERTOWER_DEMO_PASSWORD: ${ORDERTOWER_DEMO_PASSWORD:?ORDERTOWER_DEMO_PASSWORD is required}
    volumes:
      - ./infra/openbao/init.sh:/openbao/init.sh:ro
    entrypoint: ["/bin/sh", "/openbao/init.sh"]
    restart: "no"

  api:
    build: ./services/api
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://localhost:9080}
      # URL nội bộ để API lấy discovery và JWKS của Keycloak (jwks_uri công
      # khai không tới được từ trong container API).
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-ordertower}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-ordertower-web}
      KEYCLOAK_PORTAL_CLIENT_ID: ${KEYCLOAK_PORTAL_CLIENT_ID:-ordertower-portal}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      OPENBAO_ENABLED: ${OPENBAO_ENABLED:-1}
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_TOKEN: ${OPENBAO_ROOT_TOKEN:-dev-root-token}
      OPENBAO_SECRET_PATH: secret/data/ordertower
      OPENBAO_REQUIRED: ${OPENBAO_REQUIRED:-0}
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-true}
      CLAMAV_REQUIRED: ${CLAMAV_REQUIRED:-true}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      OLLAMA_HOST: ${OLLAMA_HOST:-http://localhost:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_AI_MODEL: ${CLOUDFLARE_AI_MODEL:-}
      TELEMETRY_DEVICE_KEY: ${TELEMETRY_DEVICE_KEY:-dev-device-key}
      TELEMETRY_ONLINE_SECONDS: ${TELEMETRY_ONLINE_SECONDS:-300}
      TELEMETRY_STALE_SECONDS: ${TELEMETRY_STALE_SECONDS:-1800}
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      openbao-init:
        condition: service_completed_successfully

  waf:
    build: ./infra/waf
    ports:
      - "127.0.0.1:8090:8080"
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      - prometheus

  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    environment:
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://localhost:9080}
      # URL nội bộ để web đổi token và lấy discovery (localhost:9080 từ
      # trong container web không tới được APISIX/Keycloak).
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-ordertower}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-ordertower-web}
      # Web gọi API qua APISIX (cửa trước), giống mặc định khi chạy dev.
      API_BASE_URL: http://apisix:9080/api
    depends_on:
      - api

volumes:
  pgdata:
  swdata:
  clamdb:
  promdata:
  grafanadata:
