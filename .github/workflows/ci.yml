# SPDX-License-Identifier: Apache-2.0
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra header giấy phép
        run: |
          pip install reuse
          reuse lint
  compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_ADMIN_PASSWORD: ci-postgres-admin
      ORDERTOWER_DB_PASSWORD: ci-ordertower-app
      KEYCLOAK_DB_PASSWORD: ci-admin-db
      KEYCLOAK_ADMIN_USERNAME: ci-admin-user
      KEYCLOAK_ADMIN_PASSWORD: ci-admin-password
      ORDERTOWER_DEMO_PASSWORD: ci-password-demo
    steps:
      - uses: actions/checkout@v4
      - name: Tạo .env từ mẫu
        run: cp .env.example .env
      - name: Kiểm tra cấu hình Compose
        run: docker compose config -q
