apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ordertower-observability
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/thienba33/OrderTower.git
    targetRevision: dev
    path: infra/gitops/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: ordertower-observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
