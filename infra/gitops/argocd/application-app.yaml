apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ordertower-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/thienba33/OrderTower.git
    targetRevision: dev
    path: infra/gitops/app
  destination:
    server: https://kubernetes.default.svc
    namespace: ordertower
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
