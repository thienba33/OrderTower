# MẪU, không nằm trong kustomization. Không commit secret thật.
# Tạo bằng kubectl create secret như README; file này chỉ minh họa key.
apiVersion: v1
kind: Secret
metadata:
  name: ordertower-secrets
type: Opaque
stringData:
  DATABASE_URL: postgres://ordertower_app:REPLACE_ME@postgres:5432/ordertower
  S3_ACCESS_KEY: REPLACE_ME
  S3_SECRET_KEY: REPLACE_ME
  OPENBAO_TOKEN: REPLACE_ME
