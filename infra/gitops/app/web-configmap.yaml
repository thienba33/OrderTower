# SPDX-License-Identifier: Apache-2.0
apiVersion: v1
kind: ConfigMap
metadata:
  name: ordertower-web-config
  labels:
    app.kubernetes.io/name: ordertower-web
    app.kubernetes.io/part-of: ordertower
data:
  NODE_ENV: production
  PORT: "3000"
  # K8s tự inject HOSTNAME = tên pod; Next standalone phải bind 0.0.0.0.
  HOSTNAME: 0.0.0.0
  APP_ORIGIN: https://ordertower.local
  COOKIE_SECURE: "true"
  KEYCLOAK_URL: https://ordertower.local
  KEYCLOAK_INTERNAL_URL: http://keycloak.ordertower.svc.cluster.local:8080
  KEYCLOAK_REALM: ordertower
  KEYCLOAK_CLIENT_ID: ordertower-web
  API_BASE_URL: http://apisix.ordertower.svc.cluster.local:9080/api
