# Một cửa TLS duy nhất: /api, /realms, /resources qua APISIX/WAF; còn lại vào web.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ordertower
  labels:
    app.kubernetes.io/name: ordertower
    app.kubernetes.io/part-of: ordertower
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ordertower.local
      secretName: ordertower-tls
  rules:
    - host: ordertower.local
      http:
        paths:
          - path: /realms
            pathType: Prefix
            backend:
              service:
                name: apisix
                port:
                  number: 9080
          - path: /resources
            pathType: Prefix
            backend:
              service:
                name: apisix
                port:
                  number: 9080
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: apisix
                port:
                  number: 9080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ordertower-web
                port:
                  number: 3000
